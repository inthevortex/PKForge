name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore
        run: dotnet restore PKForge.sln
      - name: Test
        run: |
          dotnet test tests/PKForge.Domain.Tests/PKForge.Domain.Tests.csproj --no-restore --configuration Release
          dotnet test tests/PKForge.Engine.Tests/PKForge.Engine.Tests.csproj --no-restore --configuration Release

  android:
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore
        run: dotnet restore PKForge.sln
      - name: Decode permanent release signing key
        if: github.ref_type == 'tag' && github.repository == 'sofianeelhor/PKForge'
        env:
          PKFORGE_ANDROID_KEYSTORE_BASE64: ${{ secrets.PKFORGE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$PKFORGE_ANDROID_KEYSTORE_BASE64" ]]; then
            echo "Permanent release signing secret is missing."
            exit 1
          fi
          printf '%s' "$PKFORGE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/pkforge-release.p12"
      - name: Build Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pkforge-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PKFORGE_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.PKFORGE_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.PKFORGE_ANDROID_KEY_PASSWORD }}
        run: |
          configuration="Debug"
          signing_args=(-p:AndroidKeyStore=false)
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REPOSITORY" == "sofianeelhor/PKForge" ]]; then
            configuration="Release"
            signing_args=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$ANDROID_KEYSTORE_PATH"
              -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD"
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
              -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"
            )
          fi
          dotnet build src/PKForge.App/PKForge.App.csproj --no-restore \
            --configuration "$configuration" -f net11.0-android "${signing_args[@]}"
      - name: Locate APK
        id: apk
        run: |
          apk=$(find src/PKForge.App/bin -name '*-Signed.apk' -o -name '*.apk' | head -1)
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "name=PKForge-${GITHUB_REF_NAME}.apk" >> "$GITHUB_OUTPUT"
      - name: Verify permanent release signature
        if: github.ref_type == 'tag' && github.repository == 'sofianeelhor/PKForge'
        run: |
          expected="E2:6F:3F:FF:8A:89:00:D8:5E:D8:EF:72:E1:CA:7F:50:33:D2:A5:57:98:0B:26:19:F1:1D:6D:E2:10:09:BF:D8"
          actual=$(keytool -printcert -jarfile "${{ steps.apk.outputs.path }}" | tr -d '\r' | grep -m1 'SHA256:')
          echo "$actual"
          echo "$actual" | grep -Fq "$expected"
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: pkforge-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 3
      - name: Stage release asset
        if: github.ref_type == 'tag'
        run: cp "${{ steps.apk.outputs.path }}" "PKForge-${GITHUB_REF_NAME}.apk"
      - name: Release Android APK
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: PKForge-${{ github.ref_name }}.apk
          generate_release_notes: true

  linux:
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore
        run: dotnet restore PKForge.sln
      - name: Build and package Linux desktop packages
        run: |
          version="3.1.0"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          ./tools/Packaging/package.sh "$version" "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: pkforge-linux-packages
          path: |
            artifacts/pkforge-*.tar.gz
            artifacts/pkforge_*.deb
            artifacts/pkforge-*.rpm
            artifacts/pkforge-*.pkg.tar.zst
          retention-days: 3
      - name: Release Linux Packages
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pkforge-*.tar.gz
            artifacts/pkforge_*.deb
            artifacts/pkforge-*.rpm
            artifacts/pkforge-*.pkg.tar.zst
          generate_release_notes: true
