name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-${{ github.job }}-
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore
        run: dotnet restore PKForge.sln
      - name: Test
        run: |
          dotnet test tests/PKForge.Domain.Tests/PKForge.Domain.Tests.csproj --no-restore --configuration Release
          dotnet test tests/PKForge.Engine.Tests/PKForge.Engine.Tests.csproj --no-restore --configuration Release
          dotnet test tests/PKForge.App.Tests/PKForge.App.Tests.csproj --no-restore --configuration Release

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-${{ github.job }}-
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore
        run: dotnet restore PKForge.sln
      - name: Decode permanent release signing key
        if: github.ref_type == 'tag' && github.repository == 'sofianeelhor/PKForge'
        env:
          PKFORGE_ANDROID_KEYSTORE_BASE64: ${{ secrets.PKFORGE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$PKFORGE_ANDROID_KEYSTORE_BASE64" ]]; then
            echo "Permanent release signing secret is missing."
            exit 1
          fi
          printf '%s' "$PKFORGE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/pkforge-release.p12"
      - name: Build Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pkforge-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PKFORGE_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.PKFORGE_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.PKFORGE_ANDROID_KEY_PASSWORD }}
        run: |
          configuration="Debug"
          signing_args=(-p:AndroidKeyStore=false)
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REPOSITORY" == "sofianeelhor/PKForge" ]]; then
            configuration="Release"
            signing_args=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$ANDROID_KEYSTORE_PATH"
              -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD"
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
              -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"
            )
          fi
          dotnet build src/PKForge.App/PKForge.App.csproj --no-restore \
            --configuration "$configuration" -f net11.0-android "${signing_args[@]}"
      - name: Locate APK
        id: apk
        run: |
          apk=$(find src/PKForge.App/bin -name '*-Signed.apk' | head -1)
          if [[ -z "$apk" ]]; then
            echo "No signed APK was built."
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
      - name: Verify permanent release signature
        if: github.ref_type == 'tag' && github.repository == 'sofianeelhor/PKForge'
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          expected="E2:6F:3F:FF:8A:89:00:D8:5E:D8:EF:72:E1:CA:7F:50:33:D2:A5:57:98:0B:26:19:F1:1D:6D:E2:10:09:BF:D8"
          actual=$(keytool -printcert -jarfile "$APK_PATH" | tr -d '\r' | grep -m1 'SHA256:')
          echo "$actual"
          echo "$actual" | grep -Fq "$expected"
      - name: Stage APK
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          mkdir -p dist
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            cp "$APK_PATH" "dist/PKForge-${GITHUB_REF_NAME}.apk"
          else
            cp "$APK_PATH" dist/
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pkforge-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 3

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-${{ github.job }}-
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools zstd
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore
        run: dotnet restore PKForge.sln
      - name: Build and package Linux desktop packages
        run: |
          # Without a tag, package.sh reads ApplicationDisplayVersion from the csproj.
          version=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            app_version=$(sed -n 's:.*<ApplicationDisplayVersion>\(.*\)</ApplicationDisplayVersion>.*:\1:p' \
              src/PKForge.App/PKForge.App.csproj | head -1)
            if [[ "${version%%-*}" != "$app_version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match ApplicationDisplayVersion $app_version."
              exit 1
            fi
          fi
          ./tools/Packaging/package.sh "$version" "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pkforge-linux-packages
          path: |
            artifacts/pkforge-*.tar.gz
            artifacts/pkforge_*.deb
            artifacts/pkforge-*.rpm
            artifacts/pkforge-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [android, linux]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pkforge-*
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
